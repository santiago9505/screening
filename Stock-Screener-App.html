<!DOCTYPE html>
<html>
<head>
    <title>Stock Screener Pro</title>
    <meta http-equiv="refresh" content="0;url=http://localhost:3002">
    <style>
        body {
            background: #1a1f2e;
            color: white;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .loading {
            text-align: center;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading">
        <div class="spinner"></div>
        <p>Abriendo Stock Screener Pro...</p>
        <p style="font-size: 12px; color: #888;">Si no abre automáticamente, verifica que el servidor esté corriendo</p>
    </div>
</body>
</html>
